name: CI Dev Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install server dependencies
        working-directory: server
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Server syntax check
        run: |
          node --check server/index.js
          node --check server/settings.js
          node --check server/db/index.js
          node --check server/db/adapters/sqlite.js
          node --check server/db/adapters/postgres.js

      - name: Migration smoke test (SQLite)
        working-directory: server
        env:
          DB_DRIVER: sqlite
          SQLITE_PATH: /tmp/ktrain-ci.sqlite
          KTRAIN_BOOTSTRAP_DB: /tmp/ktrain-ci.sqlite
        run: npm run migrate:status

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run client tests
        working-directory: client
        run: npm run test -- --run

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Validate Docker Compose (dev + prod)
        run: |
          cp .env.example .env.dev
          cp .env.example .env.prod
          docker compose -f docker-compose.dev.yml config > /tmp/compose-dev.out
          docker compose -f docker-compose.prod.yml config > /tmp/compose-prod.out
          rm -f .env.dev .env.prod

  build_push:
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write
    outputs:
      immutable_tag: ${{ steps.meta.outputs.immutable_tag }}
      dev_tag: ${{ steps.meta.outputs.dev_tag }}
      image_sha: ${{ steps.meta.outputs.image_sha }}
      version_label: ${{ steps.meta.outputs.version_label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set image metadata
        id: meta
        run: |
          VERSION_BASE="$(node -p "require('./server/package.json').version")"
          SHORT_SHA="${GITHUB_SHA::12}"
          VERSION_LABEL="${VERSION_BASE}-${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          echo "dev_tag=ghcr.io/${GITHUB_REPOSITORY}:ktrain-dev" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=ghcr.io/${GITHUB_REPOSITORY}:ktrain-dev-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version_label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.dev_tag }}
            ${{ steps.meta.outputs.immutable_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version_label }}

  deploy_dev:
    runs-on: ubuntu-latest
    needs: build_push
    concurrency:
      group: ktrain-dev-deploy
      cancel-in-progress: true
    steps:
      - name: Guard deploy secrets
        id: guard
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ -n "${HETZNER_HOST:-}" ] && [ -n "${HETZNER_USER:-}" ] && [ -n "${HETZNER_SSH_KEY:-}" ] && [ -n "${DEPLOY_PATH:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Dev deploy is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Dev deploy is skipped because required secrets are missing."
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Upload deployment assets (dev)
        if: steps.guard.outputs.enabled == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "docker-compose.dev.yml,.env.example,scripts/deploy-dev.sh,scripts/healthcheck.sh"
          target: "${{ secrets.DEPLOY_PATH }}-dev"
          overwrite: true

      - name: Deploy ktrain-dev via SSH
        if: steps.guard.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH_BASE: ${{ secrets.DEPLOY_PATH }}
          MASTER_KEY_SECRET: ${{ secrets.KTRAIN_MASTER_KEY }}
          IMAGE_REF: ${{ needs.build_push.outputs.immutable_tag }}
          APP_BUILD: ${{ github.run_number }}
          APP_COMMIT: ${{ github.sha }}
          APP_VERSION: ${{ needs.build_push.outputs.version_label }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: DEPLOY_PATH_BASE,MASTER_KEY_SECRET,IMAGE_REF,APP_BUILD,APP_COMMIT,APP_VERSION
          script: |
            set -euo pipefail
            if [ -z "${DEPLOY_PATH_BASE:-}" ]; then
              echo "Missing DEPLOY_PATH secret"
              exit 1
            fi

            DEPLOY_PATH="${DEPLOY_PATH_BASE%/}-dev"
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [ ! -f ".env.dev" ]; then
              if [ -f ".env" ]; then
                cp .env .env.dev
              elif [ -f ".env.example" ]; then
                cp .env.example .env.dev
              else
                touch .env.dev
              fi
            fi

            upsert_env() {
              key="$1"
              value="$2"
              file="$3"
              escaped="$(printf '%s' "$value" | sed -e 's/[|&]/\\&/g')"
              if grep -q "^${key}=" "$file"; then
                sed -i "s|^${key}=.*$|${key}=${escaped}|" "$file"
              else
                printf '%s=%s\n' "$key" "$value" >> "$file"
              fi
            }

            upsert_env "NODE_ENV" "production" ".env.dev"
            upsert_env "APP_ENV" "development" ".env.dev"
            upsert_env "DB_DRIVER" "sqlite" ".env.dev"
            upsert_env "SQLITE_PATH" "/data/ktrain.sqlite" ".env.dev"
            upsert_env "KTRAIN_BOOTSTRAP_DB" "/data/ktrain.sqlite" ".env.dev"
            upsert_env "DB_RUNTIME_CONFIG_PATH" "/data/runtime-db.json" ".env.dev"
            upsert_env "DB_SWITCH_DUMP_DIR" "/data/db-switch" ".env.dev"
            upsert_env "DB_SWITCH_AUDIT_LOG" "/data/db-switch/switch-audit.log" ".env.dev"
            if ! grep -q '^APP_BASE_URL=' ".env.dev"; then
              upsert_env "APP_BASE_URL" "http://127.0.0.1:3000" ".env.dev"
            fi
            upsert_env "APP_MODE" "info" ".env.dev"
            upsert_env "APP_BUILD" "$APP_BUILD" ".env.dev"
            upsert_env "APP_COMMIT" "$APP_COMMIT" ".env.dev"
            upsert_env "APP_VERSION" "$APP_VERSION" ".env.dev"

            if [ -n "${MASTER_KEY_SECRET:-}" ]; then
              upsert_env "KTRAIN_MASTER_KEY" "$MASTER_KEY_SECRET" ".env.dev"
            fi

            chmod 600 .env.dev || true
            chmod +x scripts/*.sh || true

            APP_DIR="$DEPLOY_PATH" \
            IMAGE="$IMAGE_REF" \
            APP_BUILD="$APP_BUILD" \
            APP_COMMIT="$APP_COMMIT" \
            APP_VERSION="$APP_VERSION" \
            READINESS_PATH="/healthz" \
            READINESS_TIMEOUT_SEC="180" \
            READINESS_POLL_SEC="2" \
            ./scripts/deploy-dev.sh

      - name: Deploy skipped notice
        if: steps.guard.outputs.enabled != 'true'
        run: echo "Skipping dev deploy because one or more required secrets are not configured."
