services:
  ktrain:
    image: ${IMAGE:-ghcr.io/viktordrukker/ktrain:ktrain-dev}
    container_name: ktrain_dev
    env_file:
      - .env.dev
    expose:
      - "3000"
    volumes:
      - ktrain_dev_data:/data
    networks:
      ktrain_dev_net: {}
      caddy_net:
        aliases:
          - ktrain-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 8

volumes:
  ktrain_dev_data:

networks:
  ktrain_dev_net:
    driver: bridge
  caddy_net:
    external: true
