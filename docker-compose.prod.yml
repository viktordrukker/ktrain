services:
  ktrain:
    image: ${IMAGE:-ghcr.io/viktordrukker/ktrain:ktrain}
    container_name: ktrain
    env_file:
      - .env.prod
    expose:
      - "3000"
    volumes:
      - ktrain_prod_data:/data
    networks:
      - ktrain_net
      - caddy_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 8

volumes:
  ktrain_prod_data:
    name: ktrain-data

networks:
  ktrain_net:
    driver: bridge
  caddy_net:
    external: true
